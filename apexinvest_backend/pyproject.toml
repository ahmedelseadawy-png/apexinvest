[project]
name = "apexinvest-backend"
version = "0.1.0"
description = "ApexInvest API — FastAPI backend, engine and mobile web app."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Original apexinvest_backend/requirements.lock pins — UNCHANGED (validated
    # dependency set: 4,262 comparisons / 0 differences, see CLOUD_VALIDATION_REPORT.md).
    # This list only ADDS the packages fastapi[standard] itself resolves to (below),
    # so FastAPI Cloud's default "fastapi" command is available. No engine or API
    # dependency version above this comment differs from requirements.lock.
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "cryptography==50.0.1",
    "et_xmlfile==2.0.0",
    "fastapi[standard]==0.141.1",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.20",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pdfminer.six==20260107",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "pypdfium2==5.13.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "six==1.17.0",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
    "uvicorn==0.53.0",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==17.1",
    # Pulled in by fastapi[standard]==0.141.1 (empirically resolved, pinned to the
    # exact versions pip installed on top of the unmodified lock — see deployment notes).
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "Pygments==2.21.0",
    "agent-detector==2.0.0",
    "detect-installer==0.2.1",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "fastapi-cli==0.0.32",
    "fastapi-cloud-cli==0.26.0",
    "fastar==0.12.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "pydantic-extra-types==2.11.1",
    "pydantic-settings==2.15.0",
    "rich-toolkit==0.20.5",
    "rich==15.0.0",
    "rignore==0.8.1",
    "sentry-sdk==2.69.2",
    "shellingham==1.5.4",
    "typer==0.27.2",
]

[tool.fastapi]
entrypoint = "apexinvest.api.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the actual Python package. mobile/ (static PWA), tests/, cloud_validation/,
# etc. sit alongside it as plain directories, not importable packages — without
# this, setuptools refuses to build (ambiguous flat-layout, see deployment notes).
include = ["apexinvest*"]
